[package]
name = "zj-redback-dev-status"
version = "0.1.0"
edition = "2021"
description = "Zellij sidebar plugin listing dev workspaces by name for session switching"
license = "MIT"

[[bin]]
name = "zj-redback-dev-status"
path = "src/main.rs"

[dependencies]
zellij-tile = "0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
